name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

  unit:
    name: Unit tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mac-arm64, os: macos-15}
          - {name: mac-x64, os: macos-15-intel}
          - {name: windows-x64, os: windows-latest}
          - {name: linux-x64, os: ubuntu-latest, renderer: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:node
      # No --with-deps: the runner has Chromium's libraries and its apt mirror
      # stalls. A screenshot, text-measuring or headed test needs it for fonts.
      - if: matrix.renderer
        run: bunx playwright install chromium --only-shell
        timeout-minutes: 5
      - if: matrix.renderer
        run: bun run test:renderer

  no-developer-tools:
    name: A Mac with no developer tools
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # After every step that needs the runner's tools: a later /usr/bin stub run
      # without DEVELOPER_DIR opens the "install developer tools" dialog (ADR 0025).
      - name: Move Xcode and the Command Line Tools out of the way
        run: |
          set -euo pipefail

          for tools in /Applications/Xcode*.app /Library/Developer/CommandLineTools; do
            if [[ -e $tools || -L $tools ]]; then sudo mv "$tools" "$tools.away"; fi
          done
      - name: Find no developer tools while the link to them is left
        run: bun run test:node app/provider-host/src/modules/vendor-environment
        env:
          UZ_NO_DEVELOPER_TOOLS: '1'
      - name: Remove the link
        run: |
          set -euo pipefail

          sudo rm -f /var/db/xcode_select_link

          if /usr/bin/xcode-select -p; then
            echo "::error::xcode-select still finds developer tools, so this job would test nothing."
            exit 1
          fi
      - run: bun run test:node app/main/src/modules/developer-folder app/provider-host/src/modules/vendor-environment
        env:
          UZ_NO_DEVELOPER_TOOLS: '1'

  linux-no-git:
    name: Linux with no git
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # The image has no git. setup-bun unpacks with unzip and setup-node with
      # xz, and git's HTTPS needs the system's libcurl (ADR 0026).
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip xz-utils libcurl4t64 openssl
      - name: Trust a certificate for 127.0.0.1
        run: |
          mkdir -p /tmp/uz-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 \
            -keyout /tmp/uz-tls/key.pem -out /tmp/uz-tls/cert.pem
          cp /tmp/uz-tls/cert.pem /usr/local/share/ca-certificates/uz-test.crt
          update-ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Find no git
        run: |
          if command -v git; then
            echo "::error::This container has a git, so this job would test nothing."
            exit 1
          fi
      # Under plain Node: Electron needs libraries a bare container lacks.
      - run: node node_modules/vitest/vitest.mjs run --project node app/main/src/modules/git-wrapper
        env:
          UZ_NO_GIT: '1'
          UZ_TLS_FOLDER: /tmp/uz-tls

  windows-no-git:
    name: Windows with no git
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The app's git.exe is Go (ADR 0028). No go.sum, so nothing to cache.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: shell/git-exe/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      - name: Test the git.exe's Go code
        working-directory: shell/git-exe
        run: go test ./...
      - name: Build git.exe
        working-directory: shell
        run: bun run build:git-exe
      # For this step alone, after every step that needs the runner's own git.
      - name: Run the tests with Git for Windows off PATH
        shell: pwsh
        env:
          UZ_NO_GIT: '1'
        run: |
          # A test checks the app's settings stay off a git found before its own.
          $env:UZ_USER_GIT_FOLDER = Split-Path (Get-Command git).Source

          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path ([IO.Path]::Combine($_, 'git.exe')))
          }) -join ';'

          if (Get-Command git -ErrorAction SilentlyContinue) {
            Write-Output "::error::PATH still holds a git, so this job would test nothing."
            exit 1
          }

          bun run test:node app/main/src/modules/git-wrapper

  provider-checks:
    name: Provider checks on a vendor bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run scripts/provider-checks-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  interaction-limits-renewal:
    name: Interaction limits renewal is on
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # GitHub turns off a public repo's scheduled workflows after 60 days with no
    # activity, and a later push doesn't turn them back on.
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=renew-interaction-limits.yml

          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state 2>lookup-error); then
            if grep -q 'HTTP 404' lookup-error; then
              echo "::notice::$workflow isn't on main yet, so there is no schedule to check."
              exit 0
            fi
            cat lookup-error >&2
            exit 1
          fi

          if [[ $state != active ]]; then
            echo "::error::$workflow is $state, so the interaction limit stops renewing. Turn it back on with: gh workflow enable $workflow"
            exit 1
          fi

  ci:
    name: CI
    if: always()
    needs:
      [
        checks,
        unit,
        no-developer-tools,
        linux-no-git,
        windows-no-git,
        provider-checks,
        interaction-limits-renewal,
      ]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "unit: ${{ needs.unit.result }}"
          echo "no-developer-tools: ${{ needs.no-developer-tools.result }}"
          echo "linux-no-git: ${{ needs.linux-no-git.result }}"
          echo "windows-no-git: ${{ needs.windows-no-git.result }}"
          echo "provider-checks: ${{ needs.provider-checks.result }}"
          echo "interaction-limits-renewal: ${{ needs.interaction-limits-renewal.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.unit.result }}" = success && test "${{ needs.no-developer-tools.result }}" = success && test "${{ needs.linux-no-git.result }}" = success && test "${{ needs.windows-no-git.result }}" = success && test "${{ needs.provider-checks.result }}" = success && test "${{ needs.interaction-limits-renewal.result }}" = success
