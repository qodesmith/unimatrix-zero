name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

  unit:
    name: Unit tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mac-arm64, os: macos-15}
          - {name: mac-x64, os: macos-15-intel}
          - {name: windows-x64, os: windows-latest}
          - {name: linux-x64, os: ubuntu-latest, renderer: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:node
      # No --with-deps: the runner already has Chromium's libraries, and the apt
      # mirror --with-deps uses often stalls for minutes. Without the fonts it adds,
      # non-Latin text and emoji render as boxes, so add it back before writing a
      # screenshot, text-measuring, or headed test.
      - if: matrix.renderer
        run: bunx playwright install chromium --only-shell
        timeout-minutes: 5
      - if: matrix.renderer
        run: bun run test:renderer

  ci:
    name: CI
    if: always()
    needs: [checks, unit]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "unit: ${{ needs.unit.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.unit.result }}" = success
