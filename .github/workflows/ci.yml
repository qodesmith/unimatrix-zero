name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

  unit:
    name: Unit tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mac-arm64, os: macos-15}
          - {name: mac-x64, os: macos-15-intel}
          - {name: windows-x64, os: windows-latest}
          - {name: linux-x64, os: ubuntu-latest, renderer: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:node
      # No --with-deps: the runner already has Chromium's libraries, and its apt
      # mirror often stalls for minutes. Without its fonts,
      # non-Latin text and emoji render as boxes, so add it back before writing a
      # screenshot, text-measuring, or headed test.
      - if: matrix.renderer
        run: bunx playwright install chromium --only-shell
        timeout-minutes: 5
      - if: matrix.renderer
        run: bun run test:renderer

  provider-checks:
    name: Provider checks on a vendor bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # Re-run this job once `bun run provider-checks` has posted its result.
      - run: bun run scripts/provider-checks-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  interaction-limits-renewal:
    name: Interaction limits renewal is on
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # GitHub turns off a public repo's scheduled workflows after 60 days with no
    # activity, and a later push doesn't turn them back on.
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow=renew-interaction-limits.yml

          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state 2>lookup-error); then
            if grep -q 'HTTP 404' lookup-error; then
              echo "::notice::$workflow isn't on main yet, so there is no schedule to check."
              exit 0
            fi
            cat lookup-error >&2
            exit 1
          fi

          if [[ $state != active ]]; then
            echo "::error::$workflow is $state, so the interaction limit stops renewing. Turn it back on with: gh workflow enable $workflow"
            exit 1
          fi

  ci:
    name: CI
    if: always()
    needs: [checks, unit, provider-checks, interaction-limits-renewal]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "unit: ${{ needs.unit.result }}"
          echo "provider-checks: ${{ needs.provider-checks.result }}"
          echo "interaction-limits-renewal: ${{ needs.interaction-limits-renewal.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.unit.result }}" = success && test "${{ needs.provider-checks.result }}" = success && test "${{ needs.interaction-limits-renewal.result }}" = success
